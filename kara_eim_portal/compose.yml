services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: kara
      POSTGRES_USER: kara
      POSTGRES_PASSWORD: kara-local-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kara"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    environment:
      DJANGO_SECRET_KEY: local-docker-key-change-before-deployment
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: kara
      POSTGRES_USER: kara
      POSTGRES_PASSWORD: kara-local-only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - uploaded_files:/app/media
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    command: python manage.py run_intake_worker
    environment:
      DJANGO_SECRET_KEY: local-docker-key-change-before-deployment
      DJANGO_DEBUG: "1"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      POSTGRES_DB: kara
      POSTGRES_USER: kara
      POSTGRES_PASSWORD: kara-local-only
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
      - uploaded_files:/app/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  uploaded_files:
